# Ruff configuration file
# Exclude notebooks from linting as they can have different formatting requirements
exclude = [
    "notebooks/*.ipynb",
    "*.ipynb"
]

# Set line length to match common Python standards
line-length = 120

# Target Python 3.13 as specified in pyproject.toml
target-version = "py313"

[lint]
# Enable common linting rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade
]
