[project]
name = "guideline-rag"
version = "0.1.0"
description = "A Retrieval-Augmented Generation (RAG) system for medical guidelines"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.6.0",
    "arize-phoenix-otel>=0.9.2",
    "azure-core>=1.34.0",
    "docling>=2.32.0",
    "einops>=0.8.1",
    "ftfy>=6.3.1",
    "generative-ai-hub-sdk[all]>=4.12.4",
    "google-genai>=1.15.0",
    "hf-xet>=1.1.1",
    "ipykernel>=6.29.5",
    "langchain>=0.3.25",
    "langchain-chroma>=0.1.2",
    "langchain-community>=0.3.21",
    "langchain-docling>=0.2.0",
    "langchain-google-genai>=2.1.4",
    "langchain-openai>=0.3.16",
    "langchain-qdrant>=0.2.0",
    "langgraph>=0.4.3",
    "numpy<2",
    "openai>=1.78.1",
    "pdfminer>=20191125",
    "pypdf2>=3.0.1",
    "qwen-vl-utils>=0.0.11",
    "requests>=2.32.3",
    "tenacity>=9.1.2",
    "tesseract>=0.1.3",
    "torch>=2.7.0",
    "tqdm>=4.67.1",
    "transformers>=4.51.3",
    "unstructured-ingest[pdf]>=1.0.28",
    "unstructured[pdf]>=0.17.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.24.0",
    "factory-boy>=3.3.0",
]
dev = [
    "guideline-rag[test]",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
guideline-rag = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=30",
    "-v"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
